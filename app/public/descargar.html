<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fitness Life: Gym y Nutrición</title>
<meta name="description" content="Tu plan de fuerza en 1 minuto, entreno guiado con manos libres, nutrición y coach con IA. Gratis en iPhone y Android.">
<meta property="og:title" content="Fitness Life: Gym y Nutrición">
<meta property="og:description" content="Tu plan de fuerza en 1 minuto, entreno guiado con manos libres, nutrición y coach con IA.">
<meta property="og:image" content="descargar/es-01-inicio.jpg">
<meta name="theme-color" content="#0b0d10">
<link rel="icon" href="icon.svg">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
  :root { --brand: #f26b1d; --ink: #0b0d10; --ink2: #15181d; --line: rgba(255,255,255,.1); --text: #fff; --muted: rgba(255,255,255,.68); }
  * { box-sizing: border-box; margin: 0; }
  html { -webkit-text-size-adjust: 100%; }
  body { font-family: "Inter Variable", Inter, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: var(--text); line-height: 1.5;
    background: radial-gradient(120% 50% at 50% 0%, rgba(242,107,29,.35), rgba(242,107,29,0) 60%), var(--ink); min-height: 100vh; }
  a { color: inherit; }
  .wrap { max-width: 1040px; margin: 0 auto; padding: 0 20px; }
  header { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: calc(16px + env(safe-area-inset-top)) 0 8px; }
  .brand { display: flex; align-items: center; gap: 10px; font-weight: 800; letter-spacing: .02em; text-decoration: none; }
  .brand img { width: 40px; height: 40px; border-radius: 10px; }
  .langs { display: flex; gap: 6px; }
  .langs button { background: none; border: 1px solid var(--line); color: var(--muted); border-radius: 999px; padding: 4px 10px; font: inherit; font-size: 13px; cursor: pointer; }
  .langs button[aria-pressed="true"] { border-color: var(--brand); color: #fff; background: rgba(242,107,29,.18); }
  .hero { display: grid; gap: 32px; align-items: center; padding: 40px 0 24px; }
  @media (min-width: 860px) { .hero { grid-template-columns: 1.1fr .9fr; padding-top: 64px; } }
  h1 { font-size: clamp(34px, 6vw, 56px); line-height: 1.05; font-weight: 800; letter-spacing: -.02em; }
  h1 span { color: var(--brand); }
  .lead { margin-top: 16px; font-size: 18px; color: var(--muted); max-width: 34em; }
  .stores { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 28px; }
  .store { display: inline-flex; align-items: center; gap: 10px; padding: 10px 18px; min-height: 56px; border-radius: 14px; background: #000; border: 1px solid rgba(255,255,255,.25); text-decoration: none; }
  .store:hover { border-color: #fff; }
  .store svg { width: 26px; height: 26px; flex: none; }
  .store small { display: block; font-size: 11px; color: var(--muted); line-height: 1.1; }
  .store b { display: block; font-size: 18px; line-height: 1.2; }
  .web { display: inline-block; margin-top: 16px; color: var(--muted); font-size: 15px; }
  .free { margin-top: 18px; font-size: 14px; color: var(--muted); }
  .phones { display: flex; justify-content: center; gap: 14px; }
  .phones img { width: 46%; max-width: 230px; border-radius: 22px; box-shadow: 0 30px 80px rgba(0,0,0,.55); }
  .phones img:nth-child(2) { margin-top: 48px; }
  section { padding: 40px 0; }
  h2 { font-size: clamp(26px, 4vw, 36px); font-weight: 800; letter-spacing: -.01em; text-align: center; }
  .grid { display: grid; gap: 14px; margin-top: 28px; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); }
  .card { background: var(--ink2); border: 1px solid var(--line); border-radius: 18px; padding: 20px; }
  .card .ico { font-size: 28px; }
  .card h3 { margin-top: 8px; font-size: 18px; }
  .card p { margin-top: 6px; color: var(--muted); font-size: 15px; }
  .gallery { display: flex; gap: 14px; overflow-x: auto; padding: 24px 4px 8px; scroll-snap-type: x mandatory; scrollbar-width: none; }
  .gallery img { width: 210px; flex: none; border-radius: 20px; scroll-snap-align: center; box-shadow: 0 16px 40px rgba(0,0,0,.4); }
  .cta { text-align: center; padding: 48px 0 32px; }
  .cta .stores { justify-content: center; }
  footer { border-top: 1px solid var(--line); padding: 24px 0 calc(24px + env(safe-area-inset-bottom)); color: var(--muted); font-size: 14px; display: flex; flex-wrap: wrap; gap: 8px 20px; justify-content: space-between; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <a class="brand" href="./descargar.html"><img src="icon-192.png" alt="">FITNESS LIFE</a>
    <div class="langs" role="group" aria-label="Idioma">
      <button data-lang="es">ES</button><button data-lang="en">EN</button><button data-lang="pt">PT</button>
    </div>
  </header>

  <main>
    <div class="hero">
      <div>
        <h1 data-t="title"></h1>
        <p class="lead" data-t="lead"></p>
        <div class="stores" data-stores></div>
        <a class="web" href="./" data-t="web"></a>
        <p class="free" data-t="free"></p>
      </div>
      <div class="phones">
        <img data-shot="01-inicio" alt="">
        <img data-shot="02-guiado" alt="">
      </div>
    </div>

    <section>
      <h2 data-t="featuresTitle"></h2>
      <div class="grid" data-features></div>
    </section>

    <section>
      <h2 data-t="galleryTitle"></h2>
      <div class="gallery">
        <img data-shot="01-inicio" alt=""><img data-shot="02-guiado" alt=""><img data-shot="04-nutricion" alt=""><img data-shot="05-retos" alt=""><img data-shot="06-insignias" alt="">
      </div>
    </section>

    <div class="cta">
      <h2 data-t="ctaTitle"></h2>
      <div class="stores" data-stores></div>
    </div>
  </main>

  <footer>
    <span>© Fitness Life</span>
    <span><a href="legal.html#privacidad" data-t="privacy"></a> · <a href="legal.html#terminos" data-t="terms"></a></span>
  </footer>
</div>

<script>
  const APP_STORE = 'https://apps.apple.com/app/id6822443646';
  const PLAY = 'https://play.google.com/store/apps/details?id=com.fitnesslife.app';
  const T = {
    es: {
      title: 'Tu plan de fuerza, <span>listo en 1 minuto</span>',
      lead: 'Rutinas para el gimnasio o para casa, entreno guiado con manos libres, nutrición sin complicarte y un entrenador con IA. Todo en una app.',
      web: 'O úsala ahora en el navegador →', free: 'Gratis para entrenar · Sin anuncios · En 15 idiomas',
      appStore: ['Descárgala en el', 'App Store'], play: ['Disponible en', 'Google Play'],
      featuresTitle: 'Todo lo que necesitas para progresar', galleryTitle: 'Así se ve', ctaTitle: 'Empieza hoy, gratis',
      privacy: 'Privacidad', terms: 'Términos',
      features: [
        ['🏋️', 'Tu plan, a tu medida', 'Según tu objetivo, tu nivel, tus días y dónde entrenas. Avanza cada semana.'],
        ['🎙️', 'Entreno guiado y manos libres', 'Entreno a pantalla completa con cuenta atrás. Con Premium, di «listo» o «siguiente» sin tocar el teléfono.'],
        ['🥗', 'Nutrición fácil', 'Calorías, proteína, agua y planes de comidas. Con Premium: escáner, ayuno y lista de la compra.'],
        ['🤖', 'Coach con IA (Premium)', 'Pregúntale qué entrenar, pídele rutinas o un plan de comidas de 7 días.'],
        ['🔥', 'Retos y rachas', 'Retos de 30 días, ranking con amigos e insignias. Con Premium, un resumen cada domingo.'],
        ['🩹', 'Modo descanso o lesión', 'Tu racha no se pierde y los entrenos cuidan la zona que te duele.'],
      ],
    },
    en: {
      title: 'Your strength plan, <span>ready in 1 minute</span>',
      lead: 'Gym or home workouts, hands-free guided training, nutrition made simple and an AI coach. All in one app.',
      web: 'Or use it now in your browser →', free: 'Free to train · No ads · In 15 languages',
      appStore: ['Download on the', 'App Store'], play: ['Get it on', 'Google Play'],
      featuresTitle: 'Everything you need to progress', galleryTitle: 'Take a look', ctaTitle: 'Start today, for free',
      privacy: 'Privacy', terms: 'Terms',
      features: [
        ['🏋️', 'A plan made for you', 'Built on your goal, level, days and where you train. It moves forward every week.'],
        ['🎙️', 'Guided and hands-free', 'Full-screen workouts with a countdown. With Premium, say "done" or "next" without touching your phone.'],
        ['🥗', 'Simple nutrition', 'Calories, protein, water and meal plans. With Premium: barcode scanner, fasting and a shopping list.'],
        ['🤖', 'AI coach (Premium)', 'Ask what to train, get routines or a 7-day meal plan.'],
        ['🔥', 'Challenges and streaks', '30-day challenges, a friends ranking and badges. With Premium, a summary every Sunday.'],
        ['🩹', 'Rest or injury mode', 'Keep your streak, and workouts protect the sore area.'],
      ],
    },
    pt: {
      title: 'Seu plano de força, <span>pronto em 1 minuto</span>',
      lead: 'Treinos na academia ou em casa, treino guiado com mãos livres, nutrição sem complicação e um coach com IA. Tudo em um app.',
      web: 'Ou use agora no navegador →', free: 'Grátis para treinar · Sem anúncios · Em 15 idiomas',
      appStore: ['Baixar na', 'App Store'], play: ['Disponível no', 'Google Play'],
      featuresTitle: 'Tudo o que você precisa para evoluir', galleryTitle: 'Veja como é', ctaTitle: 'Comece hoje, grátis',
      privacy: 'Privacidade', terms: 'Termos',
      features: [
        ['🏋️', 'Seu plano, do seu jeito', 'Pelo seu objetivo, nível, dias e onde você treina. Avança toda semana.'],
        ['🎙️', 'Treino guiado e mãos livres', 'Treino em tela cheia com contagem regressiva. Com o Premium, diga «pronto» ou «próximo» sem tocar no celular.'],
        ['🥗', 'Nutrição fácil', 'Calorias, proteína, água e planos de refeições. Com o Premium: leitor, jejum e lista de compras.'],
        ['🤖', 'Coach com IA (Premium)', 'Pergunte o que treinar, peça rotinas ou um plano de refeições de 7 dias.'],
        ['🔥', 'Desafios e sequências', 'Desafios de 30 dias, ranking com amigos e insígnias. Com o Premium, um resumo todo domingo.'],
        ['🩹', 'Modo descanso ou lesão', 'Sua sequência não se perde e os treinos protegem a região.'],
      ],
    },
  };
  const APPLE = '<svg viewBox="0 0 24 24" fill="#fff" aria-hidden="true"><path d="M16.37 12.6c-.02-2.2 1.8-3.26 1.88-3.31-1.03-1.5-2.62-1.7-3.18-1.73-1.35-.14-2.64.8-3.33.8-.69 0-1.74-.78-2.87-.76-1.47.02-2.83.86-3.59 2.17-1.54 2.66-.39 6.6 1.1 8.76.73 1.06 1.6 2.24 2.73 2.2 1.1-.04 1.51-.71 2.84-.71 1.32 0 1.7.71 2.86.69 1.18-.02 1.93-1.07 2.65-2.13.83-1.22 1.18-2.41 1.2-2.47-.03-.01-2.3-.88-2.32-3.5zM14.2 6.13c.6-.73 1.01-1.75.9-2.76-.87.04-1.92.58-2.54 1.31-.56.64-1.05 1.67-.92 2.66.97.08 1.96-.49 2.56-1.21z"/></svg>';
  const GPLAY = '<svg viewBox="0 0 24 24" aria-hidden="true"><path fill="#34A853" d="M3.6 2.3 13.5 12l-9.9 9.7c-.4-.2-.6-.6-.6-1.1V3.4c0-.5.2-.9.6-1.1z"/><path fill="#FBBC04" d="m17 8.5-3.5 3.5L17 15.5l3.9-2.2c.8-.5.8-1.6 0-2.1z"/><path fill="#EA4335" d="M13.5 12 3.6 21.7c.3.2.8.2 1.2 0L17 15.5z"/><path fill="#4285F4" d="M13.5 12 17 8.5 4.8 2.3c-.4-.2-.9-.2-1.2 0z"/></svg>';

  const pick = () => {
    try { const saved = localStorage.getItem('fl-landing-lang'); if (saved && T[saved]) return saved; } catch {}
    const nav = (navigator.language || 'es').slice(0, 2);
    return T[nav] ? nav : nav === 'es' ? 'es' : (navigator.languages || []).some(l => l.startsWith('es')) ? 'es' : 'en';
  };
  const render = lang => {
    const t = T[lang];
    document.documentElement.lang = lang;
    document.querySelectorAll('[data-t]').forEach(el => { el.innerHTML = t[el.dataset.t]; });
    document.querySelectorAll('[data-shot]').forEach(img => { img.src = `descargar/${lang}-${img.dataset.shot}.jpg`; });
    document.querySelectorAll('[data-stores]').forEach(el => {
      el.innerHTML = `<a class="store" href="${APP_STORE}">${APPLE}<span><small>${t.appStore[0]}</small><b>${t.appStore[1]}</b></span></a>`
        + `<a class="store" href="${PLAY}">${GPLAY}<span><small>${t.play[0]}</small><b>${t.play[1]}</b></span></a>`;
    });
    document.querySelector('[data-features]').innerHTML = t.features
      .map(([ico, h, p]) => `<div class="card"><div class="ico" aria-hidden="true">${ico}</div><h3>${h}</h3><p>${p}</p></div>`).join('');
    document.querySelectorAll('.langs button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.lang === lang)));
  };
  document.querySelectorAll('.langs button').forEach(b => b.addEventListener('click', () => {
    try { localStorage.setItem('fl-landing-lang', b.dataset.lang); } catch {}
    render(b.dataset.lang);
  }));
  render(pick());
</script>
</body>
</html>
