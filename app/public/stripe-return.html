<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Fitness Life</title>
<style>
  :root { color-scheme: dark; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #0b0d10; color: #e8eaed; font: 17px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; text-align: center; }
  main { padding: 32px 16px; max-width: 420px; }
  .mark { width: 64px; height: 64px; border-radius: 18px; margin: 0 auto 20px; display: grid; place-items: center; background: #f26b1d; font-size: 32px; }
  h1 { font-size: 22px; margin: 0 0 8px; }
  p { color: #b4b9c0; margin: 0 0 24px; }
  a { display: inline-block; padding: 14px 28px; border-radius: 14px; background: #f26b1d; color: #fff; font-weight: 700; text-decoration: none; }
</style>
</head>
<body>
<main>
  <div class="mark" aria-hidden="true">✓</div>
  <h1 id="title"></h1>
  <p id="text"></p>
  <a id="back" href="./"></a>
</main>
<script>
  // Stripe sends people here after paying for a trainer or setting up a
  // trainer's payouts: back to the phone app, or to the web app.
  (function () {
    var q = new URLSearchParams(location.search);
    var to = ['hired', 'canceled', 'connected', 'refresh'].indexOf(q.get('to')) >= 0 ? q.get('to') : 'connected';
    var lang = (navigator.language || 'es').slice(0, 2);
    var words = {
      es: { hired: '¡Pago completado!', canceled: 'Pago cancelado', connected: 'Datos guardados', refresh: 'Vuelve a la app',
            text: 'Vuelve a Fitness Life para continuar.', back: 'Volver a Fitness Life' },
      pt: { hired: 'Pagamento concluído!', canceled: 'Pagamento cancelado', connected: 'Dados salvos', refresh: 'Volte ao app',
            text: 'Volte ao Fitness Life para continuar.', back: 'Voltar ao Fitness Life' },
      en: { hired: 'Payment complete!', canceled: 'Payment canceled', connected: 'Details saved', refresh: 'Go back to the app',
            text: 'Go back to Fitness Life to continue.', back: 'Back to Fitness Life' },
    };
    var w = words[lang] || words.en;
    document.documentElement.lang = words[lang] ? lang : 'en';
    document.getElementById('title').textContent = w[to];
    document.getElementById('text').textContent = w.text;
    var link = q.get('app') === 'native' ? 'com.fitnesslife.app://stripe-return?to=' + to
      : to === 'connected' || to === 'refresh' ? './#/entrenadores/panel' : './#/entrenadores?stripe=' + to;
    var back = document.getElementById('back');
    back.textContent = w.back;
    back.href = link;
    location.replace(link);
  })();
</script>
</body>
</html>
