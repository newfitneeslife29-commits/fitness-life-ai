# Minimal Supabase CLI config, used by .github/workflows/backend-deploy.yml.
project_id = "fitness-life"

[functions.nutrition-coach]
# The app calls it with the anonymous user's session.
verify_jwt = true

[functions.account]
# Only for signed-in users (checked again inside).
verify_jwt = true

[functions.trainer-pay]
# Signed-in accounts only (checked again inside).
verify_jwt = true

[functions.stripe-webhook]
# Called by Stripe: checked with the webhook's signing secret instead.
verify_jwt = false

[functions.chat-push]
# Signed-in accounts only: the sender of the message (checked inside).
verify_jwt = true

[functions.community-push]
# Signed-in accounts only: who liked, commented or followed (checked inside).
verify_jwt = true
