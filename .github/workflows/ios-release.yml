name: iOS for TestFlight

# Builds the signed iPhone app and uploads it to App Store Connect, where it
# shows up in TestFlight after Apple processes it (about 15 minutes).
# Run it from Actions → "iOS for TestFlight" → Run workflow.
# Every run gets a higher build number, as Apple requires.
#
# Needs, in Settings → Secrets and variables → Actions:
# - variable APPLE_TEAM_ID: the 10-character Team ID (developer.apple.com → Account → Membership).
# - secrets APPSTORE_KEY_ID, APPSTORE_ISSUER_ID and APPSTORE_PRIVATE_KEY: an App Store Connect
#   API key with the Admin role (Users and Access → Integrations → App Store Connect API).
#   APPSTORE_PRIVATE_KEY is the whole content of the downloaded .p8 file.
on:
  workflow_dispatch:

concurrency:
  group: ios-release

jobs:
  testflight:
    runs-on: macos-26
    defaults:
      run:
        working-directory: app
    env:
      TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
      KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
      ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
      BUILD_NUMBER: ${{ github.run_number }}
      VERSION_NAME: 1.0.${{ github.run_number }}
    steps:
      - uses: actions/checkout@v5
      # App Store Connect only takes apps built with the iOS 26 SDK or later.
      - name: Use the newest Xcode
        run: |
          xcode=$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)
          sudo xcode-select -s "$xcode"
          xcodebuild -version
      - name: Check the Apple settings
        env:
          PRIVATE_KEY: ${{ secrets.APPSTORE_PRIVATE_KEY }}
        run: |
          missing=""
          [ -n "$TEAM_ID" ] || missing="$missing APPLE_TEAM_ID(variable)"
          [ -n "$KEY_ID" ] || missing="$missing APPSTORE_KEY_ID"
          [ -n "$ISSUER_ID" ] || missing="$missing APPSTORE_ISSUER_ID"
          [ -n "$PRIVATE_KEY" ] || missing="$missing APPSTORE_PRIVATE_KEY"
          if [ -n "$missing" ]; then
            echo "::error::Missing Apple settings:$missing. See the comment at the top of ios-release.yml."
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/keys"
          printf '%s\n' "$PRIVATE_KEY" > "$RUNNER_TEMP/keys/AuthKey_$KEY_ID.p8"
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - name: Point the app at the Supabase backend
        working-directory: .
        run: .github/scripts/supabase-env.sh
        env:
          SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          ANON_KEY_VARIABLE: ${{ vars.VITE_SUPABASE_ANON_KEY }}
      - run: npm run native
        env:
          VITE_RC_IOS_KEY: ${{ vars.VITE_RC_IOS_KEY }}
          VITE_RC_ANDROID_KEY: ${{ vars.VITE_RC_ANDROID_KEY }}
          VITE_RC_WEB_KEY: ${{ vars.VITE_RC_WEB_KEY }}
          VITE_SENTRY_DSN: ${{ vars.VITE_SENTRY_DSN }}
      # The archive is built unsigned: a development-signed archive needs a
      # registered device. The export below signs it for the App Store with a
      # certificate and profiles made for this run, so nothing else is stored.
      - name: Archive
        run: >
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Release
          -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/App.xcarchive"
          DEVELOPMENT_TEAM="$TEAM_ID" CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO
          MARKETING_VERSION="$VERSION_NAME" CURRENT_PROJECT_VERSION="$BUILD_NUMBER"
          archive
      # An unsigned archive carries no entitlements, and the export signs with
      # the ones it finds in the app. Sign it ad hoc with App.entitlements so
      # Apple Health (HealthKit) and chat notifications work in the App Store build.
      - name: Add the entitlements
        run: |
          app="$RUNNER_TEMP/App.xcarchive/Products/Applications/App.app"
          # The home screen widget first (inside the app), with its App Group.
          widget="$app/PlugIns/FitnessWidget.appex"
          [ -d "$widget" ] || { echo "::error::The widget extension is missing from the app"; exit 1; }
          codesign --force --sign - --entitlements ios/App/FitnessWidget/FitnessWidget.entitlements "$widget"
          codesign -d --entitlements - "$widget" 2>&1 | grep -q 'group.com.fitnesslife.app' || { echo "::error::Widget App Group entitlement missing"; exit 1; }
          codesign --force --sign - --entitlements ios/App/App/App.entitlements "$app"
          codesign -d --entitlements - "$app" 2>&1 | tee "$RUNNER_TEMP/entitlements.txt"
          grep -q 'com.apple.developer.healthkit' "$RUNNER_TEMP/entitlements.txt" || { echo "::error::HealthKit entitlement missing"; exit 1; }
          grep -q 'aps-environment' "$RUNNER_TEMP/entitlements.txt" || { echo "::error::Push notifications entitlement missing"; exit 1; }
          grep -q 'group.com.fitnesslife.app' "$RUNNER_TEMP/entitlements.txt" || { echo "::error::App Group entitlement missing"; exit 1; }
      # The icon colors in Settings need the alternate icon sets inside the app.
      - name: Check the app icons
        run: |
          app="$RUNNER_TEMP/App.xcarchive/Products/Applications/App.app"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIcons:CFBundleAlternateIcons' "$app/Info.plist" | tee "$RUNNER_TEMP/icons.txt"
          count=$(grep -c 'AppIcon-' "$RUNNER_TEMP/icons.txt" || true)
          echo "Alternate icons in Info.plist: $count"
          xcrun assetutil --info "$app/Assets.car" | grep -o '"Name" : "AppIcon[^"]*"' | sort -u
          [ "$count" -ge 8 ] || { echo "::error::The alternate app icons are missing from the app"; exit 1; }
      # Xcode's cloud signing can't read App Groups with an API key, so the
      # App Store Connect API makes a distribution certificate and a profile
      # for the app and for the widget (from their App IDs, App Groups
      # included). They stay after an upload: Apple rejects a build whose
      # certificate was revoked (ITMS-90035). The next run removes older ones.
      - name: Make the signing certificate and profiles
        env:
          SIGNING_DIR: ${{ runner.temp }}/signing
          KEY_PATH: ${{ runner.temp }}/keys/AuthKey_${{ secrets.APPSTORE_KEY_ID }}.p8
          RUN: ${{ github.run_number }}-${{ github.run_attempt }}
        run: |
          mkdir -p "$SIGNING_DIR"
          /usr/bin/openssl req -new -newkey rsa:2048 -nodes -keyout "$SIGNING_DIR/key.pem" \
            -out "$SIGNING_DIR/csr.pem" -subj "/CN=Fitness Life CI/OU=$TEAM_ID" 2>/dev/null
          node ../.github/scripts/ios-signing.mjs setup
          /usr/bin/openssl x509 -inform der -in "$SIGNING_DIR/cert.cer" -out "$SIGNING_DIR/cert.pem"
          pass=$(uuidgen)
          /usr/bin/openssl pkcs12 -export -inkey "$SIGNING_DIR/key.pem" -in "$SIGNING_DIR/cert.pem" \
            -out "$SIGNING_DIR/dist.p12" -passout "pass:$pass"
          keychain="$SIGNING_DIR/signing.keychain-db"
          security create-keychain -p "$pass" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$pass" "$keychain"
          security import "$SIGNING_DIR/dist.p12" -k "$keychain" -P "$pass" -f pkcs12 -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$pass" "$keychain" > /dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          security find-identity -v -p codesigning "$keychain"
          rm -f "$SIGNING_DIR/key.pem" "$SIGNING_DIR/dist.p12"
      - name: Upload to App Store Connect
        id: upload
        run: |
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/signing/export.plist" -exportPath "$RUNNER_TEMP/export" \
            -authenticationKeyPath "$RUNNER_TEMP/keys/AuthKey_$KEY_ID.p8" \
            -authenticationKeyID "$KEY_ID" -authenticationKeyIssuerID "$ISSUER_ID"
      # When the export fails, show why from Xcode's own distribution log
      # (without request headers or tokens).
      - name: Show the signing errors
        if: failure()
        run: |
          for log in $(find "${TMPDIR:-/tmp}" /var/folders -name 'IDEDistribution*.log' -path '*xcdistributionlogs*' 2>/dev/null); do
            echo "== $log"
            grep -v -i -E 'bearer|authorization|eyJ' "$log" | grep -i -E -B2 -A8 'error|fail|denied|forbidden|unauthori|401|403|409|profile|capabilit|group' | tail -150
          done
      # Only when nothing was uploaded; an uploaded build needs its certificate.
      - name: Remove the CI certificate and profiles
        if: always()
        env:
          UPLOADED: ${{ steps.upload.outcome == 'success' }}
          SIGNING_DIR: ${{ runner.temp }}/signing
          KEY_PATH: ${{ runner.temp }}/keys/AuthKey_${{ secrets.APPSTORE_KEY_ID }}.p8
        run: |
          [ -f "$KEY_PATH" ] && node ../.github/scripts/ios-signing.mjs cleanup || true
          security delete-keychain "$SIGNING_DIR/signing.keychain-db" 2>/dev/null || true
          rm -rf "$SIGNING_DIR"
      - name: Remove the key
        if: always()
        run: rm -rf "$RUNNER_TEMP/keys"
