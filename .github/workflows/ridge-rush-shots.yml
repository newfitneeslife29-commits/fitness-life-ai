name: Ridge Rush screenshots

# Compila Ridge Rush para Linux y lo abre en una pantalla virtual con -rrShots: el juego recorre el menú,
# el garaje y varios niveles con el piloto automático y guarda capturas. Se suben a la rama
# ridge-rush-shots-<n.º de ejecución> junto con el registro del juego (para ver errores).
on:
  workflow_dispatch:
    inputs:
      levels:
        description: Niveles separados por comas (vacío = uno por mundo)
        required: false
        default: ""

concurrency:
  group: ridge-rush-shots

permissions:
  contents: write

env:
  UNITY_VERSION: 6000.0.85f2
  PROJECT_PATH: ridge-rush/RidgeRush

jobs:
  shots:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Liberar espacio en disco
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo docker image prune --all --force > /dev/null
      - uses: actions/checkout@v5
      - uses: actions/cache@v4
        with:
          path: ${{ env.PROJECT_PATH }}/Library
          key: ridge-rush-library-linux-${{ env.UNITY_VERSION }}-${{ hashFiles('ridge-rush/RidgeRush/Packages/manifest.json', 'ridge-rush/RidgeRush/Assets/**/*.cs') }}
          restore-keys: |
            ridge-rush-library-linux-${{ env.UNITY_VERSION }}-
      - name: Unity — configurar el proyecto
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: ${{ env.PROJECT_PATH }}
          unityVersion: ${{ env.UNITY_VERSION }}
          targetPlatform: StandaloneLinux64
          buildName: RidgeRush
          buildsPath: build-setup
          versioning: None
          buildMethod: RidgeRush.EditorTools.CiBuild.PrepareProject
      - name: Unity — compilar para Linux
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: ${{ env.PROJECT_PATH }}
          unityVersion: ${{ env.UNITY_VERSION }}
          targetPlatform: StandaloneLinux64
          buildName: RidgeRush
          buildsPath: build
          versioning: None
          buildMethod: RidgeRush.EditorTools.CiBuild.BuildLinuxShots
      - name: Pantalla virtual y OpenGL por software
        run: |
          # La imagen del runner suele traer Xvfb; si no, se instala (con reintentos: los espejos fallan a veces).
          if ! command -v xvfb-run > /dev/null || ! ls /usr/lib/x86_64-linux-gnu/dri/swrast_dri.so > /dev/null 2>&1; then
            for i in 1 2 3; do
              sudo apt-get update -qq || true
              sudo apt-get install -y -qq --no-install-recommends xvfb libgl1-mesa-dri libglu1-mesa > /dev/null && break
              sleep 20
            done
          fi
          command -v xvfb-run
      - name: Hacer las capturas
        env:
          LEVELS: ${{ github.event.inputs.levels }}
        run: |
          sudo chown -R "$(id -u):$(id -g)" build
          exe=$(find build -name 'RidgeRush.x86_64' -type f | head -1)
          [ -n "$exe" ] || { echo "::error::No se encontró el ejecutable"; find build -maxdepth 3; exit 1; }
          chmod +x "$exe"
          mkdir -p shots
          extra=""
          [ -n "$LEVELS" ] && extra="-rrShotLevels $LEVELS"
          export LIBGL_ALWAYS_SOFTWARE=1
          timeout 3300 xvfb-run -a -s "-screen 0 1280x720x24" "$exe" -screen-width 1280 -screen-height 720 -screen-fullscreen 0 \
            -force-glcore -rrShots "$PWD/shots" $extra -logFile "$PWD/shots/player.log" || echo "El juego terminó con código $?"
          ls -la shots
          tail -40 shots/player.log || true
      - name: Subir las capturas a una rama
        if: always()
        env:
          TOKEN: ${{ github.token }}
        run: |
          branch="ridge-rush-shots-${{ github.run_number }}"
          mkdir -p /tmp/shotrepo && cd /tmp/shotrepo
          git init -q && git checkout -q -b "$branch"
          cp "$GITHUB_WORKSPACE"/shots/* . 2>/dev/null || true
          ls -la
          git config user.name "ridge-rush-ci"
          git config user.email "ridge-rush-ci@users.noreply.github.com"
          git add -A
          git commit -q -m "Capturas de Ridge Rush (ejecución ${{ github.run_number }}, ${{ github.sha }})"
          git push -q "https://x-access-token:${TOKEN}@github.com/${{ github.repository }}.git" "HEAD:$branch"
          echo "Capturas en la rama $branch"
