name: Ridge Rush for TestFlight

# Compila el juego Ridge Rush (Unity) para iPhone y lo sube a App Store Connect,
# donde aparece en TestFlight cuando Apple termina de procesarlo (unos 15 minutos).
# Lánzalo desde Actions → "Ridge Rush for TestFlight" → Run workflow.
#
# Pasos: 1) comprobaciones y pruebas de la física, 2) Unity genera el proyecto de Xcode (Linux),
# 3) Xcode lo archiva, lo firma y lo sube (macOS). Cada ejecución lleva un número de build mayor.
#
# Necesita, en Settings → Secrets and variables → Actions:
# - Lo mismo que ios-release.yml (Fitness Life): variable APPLE_TEAM_ID y secretos
#   APPSTORE_KEY_ID, APPSTORE_ISSUER_ID y APPSTORE_PRIVATE_KEY.
# - Secretos de Unity: UNITY_EMAIL, UNITY_PASSWORD y UNITY_LICENSE (el contenido completo del
#   archivo .ulf de una licencia Personal activada en Unity Hub).
# - La app creada en App Store Connect con el ID de paquete com.ridgerush.promoto
#   (el primer paso registra el ID si falta y avisa si la app no existe todavía).
on:
  workflow_dispatch:

concurrency:
  group: ridge-rush-ios

env:
  UNITY_VERSION: 6000.0.85f2
  PROJECT_PATH: ridge-rush/RidgeRush

jobs:
  check:
    name: Comprobaciones y pruebas
    runs-on: ubuntu-latest
    env:
      TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
      KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
      ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
    steps:
      - uses: actions/checkout@v5
      - name: Comprobar los secretos
        env:
          PRIVATE_KEY: ${{ secrets.APPSTORE_PRIVATE_KEY }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
        run: |
          missing=""
          [ -n "$TEAM_ID" ] || missing="$missing APPLE_TEAM_ID(variable)"
          [ -n "$KEY_ID" ] || missing="$missing APPSTORE_KEY_ID"
          [ -n "$ISSUER_ID" ] || missing="$missing APPSTORE_ISSUER_ID"
          [ -n "$PRIVATE_KEY" ] || missing="$missing APPSTORE_PRIVATE_KEY"
          [ -n "$UNITY_EMAIL" ] || missing="$missing UNITY_EMAIL"
          [ -n "$UNITY_PASSWORD" ] || missing="$missing UNITY_PASSWORD"
          [ -n "$UNITY_LICENSE" ] || missing="$missing UNITY_LICENSE"
          if [ -n "$missing" ]; then
            echo "::error::Faltan ajustes:$missing. Mira el comentario al principio de ridge-rush-ios.yml."
            exit 1
          fi
          case "$UNITY_LICENSE" in
            *"<root"*|*"<License"*) ;;
            *) echo "::error::UNITY_LICENSE debe ser el contenido completo del archivo .ulf (XML)."; exit 1 ;;
          esac
          mkdir -p "$RUNNER_TEMP/keys"
          printf '%s\n' "$PRIVATE_KEY" > "$RUNNER_TEMP/keys/AuthKey_$KEY_ID.p8"
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: App ID y app en App Store Connect
        env:
          KEY_PATH: ${{ runner.temp }}/keys/AuthKey_${{ secrets.APPSTORE_KEY_ID }}.p8
        run: node .github/scripts/ridge-rush-ios-signing.mjs check
      - name: Quitar la clave
        if: always()
        run: rm -rf "$RUNNER_TEMP/keys"
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Pruebas de la física y de los niveles
        working-directory: ridge-rush/Tools/SimTests
        run: dotnet run -c Release

  unity:
    name: Unity → proyecto de Xcode
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      # La imagen de Unity para iOS ocupa varios GB: liberar espacio del runner.
      - name: Liberar espacio en disco
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo docker image prune --all --force > /dev/null
          df -h /
      - uses: actions/checkout@v5
      # Library/ es la caché de importación de Unity: con ella, las siguientes ejecuciones tardan mucho menos.
      - uses: actions/cache@v4
        with:
          path: ${{ env.PROJECT_PATH }}/Library
          key: ridge-rush-library-ios-${{ env.UNITY_VERSION }}-${{ hashFiles('ridge-rush/RidgeRush/Packages/manifest.json', 'ridge-rush/RidgeRush/Assets/**/*.cs') }}
          restore-keys: |
            ridge-rush-library-ios-${{ env.UNITY_VERSION }}-
      # 1.ª pasada: configura el proyecto y lo guarda (el cambio de Input System necesita reiniciar Unity).
      - name: Unity — configurar el proyecto
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: ${{ env.PROJECT_PATH }}
          unityVersion: ${{ env.UNITY_VERSION }}
          targetPlatform: iOS
          buildName: RidgeRush
          buildsPath: build-setup
          versioning: None
          buildMethod: RidgeRush.EditorTools.CiBuild.PrepareProject
      # 2.ª pasada: Unity arranca ya con la configuración guardada y genera el proyecto de Xcode.
      - name: Unity — generar el proyecto de Xcode
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: ${{ env.PROJECT_PATH }}
          unityVersion: ${{ env.UNITY_VERSION }}
          targetPlatform: iOS
          buildName: RidgeRush
          buildsPath: build
          versioning: None
          buildMethod: RidgeRush.EditorTools.CiBuild.BuildIos
          customParameters: -rrBuildNumber ${{ github.run_number }} -rrVersion 0.1.${{ github.run_number }}
      - name: Empaquetar el proyecto de Xcode
        run: |
          sudo chown -R "$(id -u):$(id -g)" build
          xcodeproj=$(find build -maxdepth 4 -name 'Unity-iPhone.xcodeproj' -type d | head -1)
          [ -n "$xcodeproj" ] || { echo "::error::Unity no generó Unity-iPhone.xcodeproj"; find build -maxdepth 3; exit 1; }
          dir=$(dirname "$xcodeproj")
          echo "Proyecto de Xcode en $dir"
          tar -czf xcode-project.tgz -C "$dir" .
          ls -lh xcode-project.tgz
      - uses: actions/upload-artifact@v4
        with:
          name: ridge-rush-xcode
          path: xcode-project.tgz
          retention-days: 3
          compression-level: 0

  testflight:
    name: Xcode → TestFlight
    needs: unity
    runs-on: macos-26
    env:
      TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
      KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
      ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
      BUILD_NUMBER: ${{ github.run_number }}
      VERSION_NAME: 0.1.${{ github.run_number }}
    steps:
      - uses: actions/checkout@v5
      # App Store Connect solo acepta apps compiladas con el SDK más reciente.
      - name: Usar el Xcode más nuevo
        run: |
          xcode=$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)
          sudo xcode-select -s "$xcode"
          xcodebuild -version
      - name: Clave de App Store Connect
        env:
          PRIVATE_KEY: ${{ secrets.APPSTORE_PRIVATE_KEY }}
        run: |
          mkdir -p "$RUNNER_TEMP/keys"
          printf '%s\n' "$PRIVATE_KEY" > "$RUNNER_TEMP/keys/AuthKey_$KEY_ID.p8"
      - uses: actions/download-artifact@v4
        with:
          name: ridge-rush-xcode
      - name: Desempaquetar
        run: |
          mkdir -p "$RUNNER_TEMP/xcode"
          tar -xzf xcode-project.tgz -C "$RUNNER_TEMP/xcode"
          ls "$RUNNER_TEMP/xcode"
      # Se archiva sin firmar; la exportación lo firma para la App Store con un certificado
      # y un perfil creados para esta ejecución (igual que Fitness Life).
      - name: Archivar
        run: >
          xcodebuild -project "$RUNNER_TEMP/xcode/Unity-iPhone.xcodeproj" -scheme Unity-iPhone -configuration Release
          -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/RidgeRush.xcarchive"
          DEVELOPMENT_TEAM="$TEAM_ID" CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO
          MARKETING_VERSION="$VERSION_NAME" CURRENT_PROJECT_VERSION="$BUILD_NUMBER"
          archive
      # El archivo se compila sin firmar y la exportación firma con los derechos que encuentra en la app:
      # se aplican aquí (Game Center) con una firma ad hoc.
      - name: Añadir los derechos (Game Center)
        run: |
          app=$(ls -d "$RUNNER_TEMP/RidgeRush.xcarchive/Products/Applications/"*.app | head -1)
          # Se genera aquí: el plist que escribe Unity en Linux no lo acepta el analizador de Apple (AMFI).
          ent="$RUNNER_TEMP/RidgeRush.entitlements"
          printf '%s\n' '<?xml version="1.0" encoding="UTF-8"?>' \
            '<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">' \
            '<plist version="1.0"><dict><key>com.apple.developer.game-center</key><true/></dict></plist>' > "$ent"
          plutil -lint "$ent"
          codesign --force --sign - --entitlements "$ent" "$app"
          codesign -d --entitlements - "$app" 2>&1 | grep -q 'game-center' || { echo "::error::Falta el derecho de Game Center"; exit 1; }
      - name: Comprobar el archivo
        run: |
          app=$(ls -d "$RUNNER_TEMP/RidgeRush.xcarchive/Products/Applications/"*.app | head -1)
          [ -d "$app" ] || { echo "::error::El archivo no contiene la app"; exit 1; }
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$app/Info.plist"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$app/Info.plist"
          /usr/libexec/PlistBuddy -c 'Print :CADisableMinimumFrameDurationOnPhone' "$app/Info.plist"
      - name: Crear el certificado y el perfil de firma
        env:
          SIGNING_DIR: ${{ runner.temp }}/signing
          KEY_PATH: ${{ runner.temp }}/keys/AuthKey_${{ secrets.APPSTORE_KEY_ID }}.p8
          RUN: ${{ github.run_number }}-${{ github.run_attempt }}
        run: |
          mkdir -p "$SIGNING_DIR"
          /usr/bin/openssl req -new -newkey rsa:2048 -nodes -keyout "$SIGNING_DIR/key.pem" \
            -out "$SIGNING_DIR/csr.pem" -subj "/CN=Ridge Rush CI/OU=$TEAM_ID" 2>/dev/null
          node .github/scripts/ridge-rush-ios-signing.mjs setup
          /usr/bin/openssl x509 -inform der -in "$SIGNING_DIR/cert.cer" -out "$SIGNING_DIR/cert.pem"
          pass=$(uuidgen)
          /usr/bin/openssl pkcs12 -export -inkey "$SIGNING_DIR/key.pem" -in "$SIGNING_DIR/cert.pem" \
            -out "$SIGNING_DIR/dist.p12" -passout "pass:$pass"
          keychain="$SIGNING_DIR/signing.keychain-db"
          security create-keychain -p "$pass" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$pass" "$keychain"
          security import "$SIGNING_DIR/dist.p12" -k "$keychain" -P "$pass" -f pkcs12 -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$pass" "$keychain" > /dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          security find-identity -v -p codesigning "$keychain"
          rm -f "$SIGNING_DIR/key.pem" "$SIGNING_DIR/dist.p12"
      - name: Subir a App Store Connect
        id: upload
        run: |
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/RidgeRush.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/signing/export.plist" -exportPath "$RUNNER_TEMP/export" \
            -authenticationKeyPath "$RUNNER_TEMP/keys/AuthKey_$KEY_ID.p8" \
            -authenticationKeyID "$KEY_ID" -authenticationKeyIssuerID "$ISSUER_ID"
      - name: Mostrar los errores de firma
        if: failure()
        run: |
          for log in $(find "${TMPDIR:-/tmp}" /var/folders -name 'IDEDistribution*.log' -path '*xcdistributionlogs*' 2>/dev/null); do
            echo "== $log"
            grep -v -i -E 'bearer|authorization|eyJ' "$log" | grep -i -E -B2 -A8 'error|fail|denied|forbidden|unauthori|401|403|409|profile|capabilit' | tail -150
          done
      # Solo si no se subió nada: una build subida necesita su certificado.
      - name: Quitar el certificado y el perfil de CI
        if: always()
        env:
          UPLOADED: ${{ steps.upload.outcome == 'success' }}
          SIGNING_DIR: ${{ runner.temp }}/signing
          KEY_PATH: ${{ runner.temp }}/keys/AuthKey_${{ secrets.APPSTORE_KEY_ID }}.p8
        run: |
          [ -f "$KEY_PATH" ] && node .github/scripts/ridge-rush-ios-signing.mjs cleanup || true
          security delete-keychain "$SIGNING_DIR/signing.keychain-db" 2>/dev/null || true
          rm -rf "$SIGNING_DIR"
      - name: Quitar la clave
        if: always()
        run: rm -rf "$RUNNER_TEMP/keys"
