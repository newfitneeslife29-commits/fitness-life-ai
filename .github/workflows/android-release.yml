name: Android for Google Play

# Builds the signed Android App Bundle (.aab) to upload to Google Play
# Console. Run it from Actions → "Android for Google Play" → Run workflow,
# then download the bundle from the run's page (Artifacts).
# Every run gets a higher version code, as Play requires.
on:
  workflow_dispatch:
  # Also checks changes to this build itself.
  pull_request:
    paths: ['.github/workflows/android-release.yml', '.github/scripts/android-upload-key.sh', 'app/android/app/build.gradle']

concurrency:
  group: android-release

jobs:
  bundle:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    env:
      SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      VERSION_CODE: ${{ github.run_number }}
      VERSION_NAME: 1.0.${{ github.run_number }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - name: Check the Supabase settings
        run: |
          if [ -z "$SUPABASE_PROJECT_REF" ] || [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::The SUPABASE_PROJECT_REF variable and the SUPABASE_ACCESS_TOKEN secret are needed (the same ones Deploy backend uses)."
            exit 1
          fi
      - run: npm ci
      - name: Point the app at the Supabase backend
        working-directory: .
        run: .github/scripts/supabase-env.sh
        env:
          ANON_KEY_VARIABLE: ${{ vars.VITE_SUPABASE_ANON_KEY }}
      - run: npm run native
        env:
          VITE_RC_IOS_KEY: ${{ vars.VITE_RC_IOS_KEY }}
          VITE_RC_ANDROID_KEY: ${{ vars.VITE_RC_ANDROID_KEY }}
          VITE_RC_WEB_KEY: ${{ vars.VITE_RC_WEB_KEY }}
      - name: Get the Google Play upload key
        working-directory: .
        run: .github/scripts/android-upload-key.sh
      - name: Build the signed App Bundle
        working-directory: app/android
        run: ./gradlew bundleRelease --no-daemon
      - name: Check the signature
        run: |
          aab=android/app/build/outputs/bundle/release/app-release.aab
          jarsigner -verify "$aab" | grep -q 'jar verified' || { echo "::error::The bundle is not signed."; exit 1; }
          mv "$aab" "android/app/build/outputs/bundle/release/fitness-life-$VERSION_NAME.aab"
          rm -f "$ANDROID_KEYSTORE_PATH"
      - uses: actions/upload-artifact@v4
        with:
          name: fitness-life-${{ env.VERSION_NAME }}
          path: app/android/app/build/outputs/bundle/release/fitness-life-${{ env.VERSION_NAME }}.aab
          if-no-files-found: error
      - name: Summary
        run: |
          {
            echo "### Fitness Life $VERSION_NAME (version code $VERSION_CODE)"
            echo "Download **fitness-life-$VERSION_NAME** under Artifacts below, unzip it and upload the .aab file in Play Console."
          } >> "$GITHUB_STEP_SUMMARY"
