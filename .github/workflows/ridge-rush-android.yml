name: Ridge Rush for Google Play

# Compila el juego Ridge Rush (Unity) como Android App Bundle (.aab) firmado para Google Play.
# Lánzalo desde Actions → "Ridge Rush for Google Play" → Run workflow y descarga el .aab de la
# página de la ejecución (Artifacts). La primera vez hay que subirlo a mano en Play Console
# (crear la app con el paquete com.ridgerush.promoto); Google Play exige esa primera subida manual.
#
# Necesita los mismos secretos que la versión de iPhone (UNITY_EMAIL, UNITY_PASSWORD, UNITY_LICENSE)
# y los del Supabase de Fitness Life (SUPABASE_PROJECT_REF variable, SUPABASE_ACCESS_TOKEN secreto),
# donde se guarda la clave de subida del juego (distinta de la de Fitness Life).
on:
  workflow_dispatch:

concurrency:
  group: ridge-rush-android

env:
  UNITY_VERSION: 6000.0.85f2
  PROJECT_PATH: ridge-rush/RidgeRush

jobs:
  tests:
    name: Pruebas de la física
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - working-directory: ridge-rush/Tools/SimTests
        run: dotnet run -c Release

  bundle:
    name: Unity → .aab firmado
    needs: tests
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Liberar espacio en disco
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo docker image prune --all --force > /dev/null
          df -h /
      - uses: actions/checkout@v5
      - name: Clave de subida de Google Play (Supabase Vault)
        env:
          SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          UPLOAD_KEY_NAME: ridgerush_upload_key
          UPLOAD_KEY_LABEL: Ridge Rush
        run: |
          .github/scripts/android-upload-key.sh
          echo "KEYSTORE_B64=$(base64 -w0 "$ANDROID_KEYSTORE_PATH")" >> "$GITHUB_ENV"
          rm -f "$ANDROID_KEYSTORE_PATH"
      - uses: actions/cache@v4
        with:
          path: ${{ env.PROJECT_PATH }}/Library
          key: ridge-rush-library-android-${{ env.UNITY_VERSION }}-${{ hashFiles('ridge-rush/RidgeRush/Packages/manifest.json', 'ridge-rush/RidgeRush/Assets/**/*.cs') }}
          restore-keys: |
            ridge-rush-library-android-${{ env.UNITY_VERSION }}-
      - name: Unity — configurar el proyecto
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: ${{ env.PROJECT_PATH }}
          unityVersion: ${{ env.UNITY_VERSION }}
          targetPlatform: Android
          buildName: RidgeRush
          buildsPath: build-setup
          versioning: None
          buildMethod: RidgeRush.EditorTools.CiBuild.PrepareProject
      - name: Unity — generar el .aab
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: ${{ env.PROJECT_PATH }}
          unityVersion: ${{ env.UNITY_VERSION }}
          targetPlatform: Android
          buildName: RidgeRush
          buildsPath: build
          versioning: None
          androidExportType: androidAppBundle
          androidKeystoreName: ridgerush.keystore
          androidKeystoreBase64: ${{ env.KEYSTORE_B64 }}
          androidKeystorePass: ${{ env.ANDROID_KEYSTORE_PASSWORD }}
          androidKeyaliasName: ${{ env.ANDROID_KEY_ALIAS }}
          androidKeyaliasPass: ${{ env.ANDROID_KEYSTORE_PASSWORD }}
          buildMethod: RidgeRush.EditorTools.CiBuild.BuildAndroid
          customParameters: -rrBuildNumber ${{ github.run_number }} -rrVersion 0.1.${{ github.run_number }}
      - name: Localizar el .aab
        run: |
          sudo chown -R "$(id -u):$(id -g)" build
          aab=$(find build -name '*.aab' | head -1)
          [ -n "$aab" ] || { echo "::error::No se generó el .aab"; find build -maxdepth 3; exit 1; }
          ls -lh "$aab"
          echo "AAB=$aab" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v4
        with:
          name: ridge-rush-android-aab
          path: ${{ env.AAB }}
          retention-days: 14
