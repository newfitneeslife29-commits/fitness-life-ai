name: Deploy backend

# Run by hand (Actions → Deploy backend → Run workflow) after adding the
# secrets and variables below. Sets up sign-in (anonymous, e-mail, Google),
# applies the database migrations, stores the function secrets in Supabase
# and deploys the AI nutrition coach, the account function and trainer
# hiring (Stripe).
#
# Secrets:   SUPABASE_ACCESS_TOKEN, ANTHROPIC_API_KEY,
#            SUPABASE_DB_PASSWORD (optional fallback for the migration),
#            REVENUECAT_SECRET_KEY (optional until Premium is set up),
#            GOOGLE_CLIENT_ID + GOOGLE_CLIENT_SECRET (optional: "Continue with Google"),
#            STRIPE_SECRET_KEY (optional: hire trainers in the app; Stripe →
#            Developers → API keys → Secret key, sk_live_…; needs Stripe Connect on)
# Variables: SUPABASE_PROJECT_REF,
#            ADMIN_EMAIL (optional: the e-mail of your account in the app; it can
#            approve trainers and set their price from the app),
#            AUTH_CONFIRM_EMAIL=true (optional: ask new accounts to confirm their
#            e-mail; needs your own SMTP in Supabase, the built-in one only
#            sends to the project's team)
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      REVENUECAT_SECRET_KEY: ${{ secrets.REVENUECAT_SECRET_KEY }}
      GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
      GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
      STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
      AUTH_CONFIRM_EMAIL: ${{ vars.AUTH_CONFIRM_EMAIL }}
      ADMIN_EMAIL: ${{ vars.ADMIN_EMAIL }}
      # The published web app (GitHub Pages): where sign-in comes back to.
      SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
    steps:
      - uses: actions/checkout@v5

      - name: Check that the secrets and variables exist and look right
        env:
          # Values pasted in the wrong tab (Secrets instead of Variables or the reverse).
          REF_AS_SECRET: ${{ secrets.SUPABASE_PROJECT_REF != '' }}
          TOKEN_AS_VARIABLE: ${{ vars.SUPABASE_ACCESS_TOKEN != '' }}
          PASSWORD_AS_VARIABLE: ${{ vars.SUPABASE_DB_PASSWORD != '' }}
          ANTHROPIC_AS_VARIABLE: ${{ vars.ANTHROPIC_API_KEY != '' }}
          STRIPE_AS_VARIABLE: ${{ vars.STRIPE_SECRET_KEY != '' }}
        run: |
          # What each value looks like, without ever printing it.
          looks_like() {
            local v="$1"
            if [ -z "$v" ]; then echo "empty"
            elif [[ "$v" == sbp_* ]]; then echo "a Supabase access token (sbp_…)"
            elif [[ "$v" == sk-ant-* ]]; then echo "an Anthropic API key (sk-ant-…)"
            elif [[ "$v" == eyJ* || "$v" == sb_publishable_* ]]; then echo "a Supabase anon/publishable key"
            elif [[ "$v" == sb_secret_* ]]; then echo "a Supabase SECRET key (do not use it here)"
            elif [[ "$v" == sk_live_* ]]; then echo "a Stripe secret key (sk_live_…)"
            elif [[ "$v" == sk_test_* ]]; then echo "a Stripe TEST secret key (sk_test_…)"
            elif [[ "$v" == pk_* ]]; then echo "a Stripe PUBLISHABLE key (pk_…, not the secret one)"
            elif [[ "$v" == rk_* ]]; then echo "a Stripe restricted key (rk_…)"
            elif [[ "$v" == http* ]]; then echo "a URL"
            elif [[ "$v" =~ ^[a-z]{20}$ ]]; then echo "a 20-letter Project ID"
            else echo "something else"
            fi
          }
          echo "What each value looks like:"
          for name in SUPABASE_ACCESS_TOKEN SUPABASE_DB_PASSWORD SUPABASE_PROJECT_REF ANTHROPIC_API_KEY STRIPE_SECRET_KEY; do
            echo "  $name → $(looks_like "${!name}")"
          done
          problems=0
          fail() { echo "::error::$1"; problems=1; }
          for name in SUPABASE_ACCESS_TOKEN SUPABASE_PROJECT_REF ANTHROPIC_API_KEY; do
            [ -z "${!name}" ] && fail "$name is missing (Settings → Secrets and variables → Actions)."
            value="${!name}"
            [[ "$value" =~ ^[[:space:]] || "$value" =~ [[:space:]]$ ]] && fail "$name has spaces or line breaks at the start or end: paste it again."
          done
          [ -n "$SUPABASE_ACCESS_TOKEN" ] && [[ "$SUPABASE_ACCESS_TOKEN" != sbp_* ]] && fail "SUPABASE_ACCESS_TOKEN must start with sbp_ (Supabase → avatar → Account preferences → Access Tokens)."
          [ -n "$ANTHROPIC_API_KEY" ] && [[ "$ANTHROPIC_API_KEY" != sk-ant-* ]] && fail "ANTHROPIC_API_KEY must start with sk-ant- (console.anthropic.com → API keys)."
          [ -n "$SUPABASE_PROJECT_REF" ] && ! [[ "$SUPABASE_PROJECT_REF" =~ ^[a-z]{20}$ ]] && fail "SUPABASE_PROJECT_REF must be the 20-letter Project ID (Project Settings → General), not the URL."
          [ "$REF_AS_SECRET" = true ] && fail "SUPABASE_PROJECT_REF is in the Secrets tab: it must be in the Variables tab."
          [ "$TOKEN_AS_VARIABLE" = true ] && fail "SUPABASE_ACCESS_TOKEN is in the Variables tab: delete it there, it must be a Secret."
          [ "$PASSWORD_AS_VARIABLE" = true ] && fail "SUPABASE_DB_PASSWORD is in the Variables tab: delete it there, it must be a Secret."
          [ "$ANTHROPIC_AS_VARIABLE" = true ] && fail "ANTHROPIC_API_KEY is in the Variables tab: delete it there, it must be a Secret."
          [ "$STRIPE_AS_VARIABLE" = true ] && fail "STRIPE_SECRET_KEY is in the Variables tab: delete it there, it must be a Secret."
          if [ -n "$STRIPE_SECRET_KEY" ]; then
            [[ "$STRIPE_SECRET_KEY" =~ ^[[:space:]] || "$STRIPE_SECRET_KEY" =~ [[:space:]]$ ]] && fail "STRIPE_SECRET_KEY has spaces or line breaks at the start or end: paste it again."
            [[ "$STRIPE_SECRET_KEY" != sk_live_* && "$STRIPE_SECRET_KEY" != sk_test_* ]] && fail "STRIPE_SECRET_KEY must be the Secret key (starts with sk_live_): Stripe → Developers → API keys."
          else
            echo "::notice::STRIPE_SECRET_KEY not set: trainers are hired through payment links or their contact, not in the app."
          fi
          [ -z "$REVENUECAT_SECRET_KEY" ] && echo "::notice::REVENUECAT_SECRET_KEY not set: everyone gets the free AI allowance until Premium is configured."
          exit $problems

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      # Asks Supabase directly, so a failure says why: wrong or revoked token,
      # wrong Project ID, or a paused project (free projects pause after a
      # week without use; this wakes them up).
      - name: Check the token and the project
        run: |
          api() { curl -sS -o /tmp/api.json -w "%{http_code}" -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" "$@"; }
          status=$(api https://api.supabase.com/v1/projects)
          if [ "$status" = 401 ] || [ "$status" = 403 ]; then
            echo "::error::Supabase rejected SUPABASE_ACCESS_TOKEN (HTTP $status): it was deleted or copied wrong. Create a new one (Supabase → avatar → Account preferences → Access Tokens) and update the secret."
            exit 1
          elif [ "$status" != 200 ]; then
            echo "::error::Supabase answered HTTP $status when listing projects: $(head -c 300 /tmp/api.json)"
            exit 1
          fi
          # Project IDs are public (they are in the app's address), names too.
          projects=$(jq -r '[.[] | "\(.name) = \(.id) (\(.status))"] | join(", ")' /tmp/api.json)
          state=$(jq -r --arg ref "$SUPABASE_PROJECT_REF" '.[] | select(.id == $ref) | .status' /tmp/api.json)
          if [ -z "$state" ]; then
            echo "::error::The token works, but its account has no project with ID $SUPABASE_PROJECT_REF. Its projects: ${projects:-none}. Put the right ID in the SUPABASE_PROJECT_REF variable."
            exit 1
          fi
          echo "::notice::Project $SUPABASE_PROJECT_REF is $state."
          if [ "$state" = INACTIVE ] || [ "$state" = PAUSED ]; then
            status=$(api -X POST "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_REF/restore")
            if [ "$status" -ge 300 ]; then
              echo "::error::The project is paused and could not be restored (HTTP $status: $(head -c 300 /tmp/api.json)). Open it in supabase.com and press Restore."
              exit 1
            fi
            echo "::notice::The project was paused: restoring it."
          fi
          # Wait until it's up (a restore takes a few minutes).
          for attempt in $(seq 1 60); do
            api "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_REF" > /dev/null
            state=$(jq -r .status /tmp/api.json)
            [ "$state" = ACTIVE_HEALTHY ] && break
            echo "Status: $state"
            sleep 15
          done
          if [ "$state" != ACTIVE_HEALTHY ]; then
            echo "::error::Project $SUPABASE_PROJECT_REF is $state, not running. Open it in supabase.com to see why."
            exit 1
          fi

      - name: Link the project
        run: |
          supabase link --project-ref "$SUPABASE_PROJECT_REF" 2>&1 | tee /tmp/link.log || {
            echo "::error::supabase link failed: $(tail -c 400 /tmp/link.log | tr '\n' ' ')"
            exit 1
          }

      # Without an account the app signs in anonymously; with one, by e-mail,
      # Google or Apple. Sign-in comes back to the web app or, in the phone
      # apps, to com.fitnesslife.app://auth-callback.
      - name: Set up sign-in
        run: |
          site=$(echo "$SITE_URL" | tr '[:upper:]' '[:lower:]')
          confirm=false
          if [ "$AUTH_CONFIRM_EMAIL" = "true" ]; then confirm=true; fi
          body=$(jq -n --arg site "$site" --argjson confirm "$confirm" '{
            external_anonymous_users_enabled: true,
            external_email_enabled: true,
            mailer_autoconfirm: ($confirm | not),
            site_url: $site,
            uri_allow_list: ($site + "**," + "com.fitnesslife.app://auth-callback," + "http://localhost:5173/**")
          }')
          if [ -n "$GOOGLE_CLIENT_ID" ] && [ -n "$GOOGLE_CLIENT_SECRET" ]; then
            body=$(echo "$body" | jq --arg id "$GOOGLE_CLIENT_ID" --arg secret "$GOOGLE_CLIENT_SECRET" \
              '. + {external_google_enabled: true, external_google_client_id: $id, external_google_secret: $secret}')
            google="on"
          else
            google="off (add the GOOGLE_CLIENT_ID and GOOGLE_CLIENT_SECRET secrets to turn it on)"
          fi
          status=$(curl -sS -o /tmp/auth.json -w "%{http_code}" -X PATCH \
            "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_REF/config/auth" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            -H "Content-Type: application/json" \
            -d "$body")
          if [ "$status" -ge 300 ]; then
            # Fine-grained tokens may lack auth_config_write. Not fatal: the
            # live check at the end tells whether sign-ins work.
            echo "::warning::Could not set up sign-in automatically (HTTP $status). Give the access token permission to change auth settings, or set them by hand in Authentication → Sign In / Providers and URL Configuration."
            cat /tmp/auth.json
            exit 0
          fi
          echo "Sign-in is set up: anonymous and e-mail on, Google $google, site $site."
          echo "New accounts confirm their e-mail: $confirm"

      # Through the Management API with the access token, so the database
      # password is only a fallback. Migrations must stay idempotent
      # (create ... if not exists), since they run on every deploy.
      - name: Apply database migrations
        run: |
          body=$(cat supabase/migrations/*.sql | jq -Rs '{query: .}')
          status=$(curl -sS -o /tmp/query.json -w "%{http_code}" -X POST \
            "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_REF/database/query" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" -H "Content-Type: application/json" -d "$body")
          if [ "$status" -lt 300 ]; then
            echo "Database is up to date."
            exit 0
          fi
          echo "Management API answered HTTP $status: $(cat /tmp/query.json)"
          if [ -z "$SUPABASE_DB_PASSWORD" ]; then
            echo "::error::Could not create the ai_usage table. Give the access token database permissions, or add the SUPABASE_DB_PASSWORD secret."
            exit 1
          fi
          supabase db push || {
            echo "::error::Database password rejected. Reset it in Supabase (Project Settings → Database → Reset database password) and update the SUPABASE_DB_PASSWORD secret."
            exit 1
          }

      # The owner's account manages trainers from the app (needs an account
      # with that e-mail in the app first).
      - name: Register the app admin
        if: env.ADMIN_EMAIL != ''
        run: |
          email=$(printf '%s' "$ADMIN_EMAIL" | tr -d '[:space:]' | tr '[:upper:]' '[:lower:]')
          if ! [[ "$email" =~ ^[a-z0-9._%+-]+@[a-z0-9.-]+\.[a-z]{2,}$ ]]; then
            echo "::error::ADMIN_EMAIL is not an e-mail address."
            exit 1
          fi
          body=$(jq -n --arg e "$email" '{query: "insert into public.app_admins (user_id) select id from auth.users where lower(email) = \u0027\($e)\u0027 on conflict do nothing returning user_id"}')
          status=$(curl -sS -o /tmp/admin.json -w "%{http_code}" -X POST \
            "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_REF/database/query" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" -H "Content-Type: application/json" -d "$body")
          if [ "$status" -ge 300 ]; then
            echo "::error::Could not register the admin (HTTP $status)."
            exit 1
          fi
          found=$(jq -n --arg e "$email" '{query: "select count(*)::int as n from public.app_admins a join auth.users u on u.id = a.user_id where lower(u.email) = \u0027\($e)\u0027"}')
          curl -sS -o /tmp/admin.json -X POST "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_REF/database/query" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" -H "Content-Type: application/json" -d "$found"
          if [ "$(jq -r '.[0].n // 0' /tmp/admin.json)" = 1 ]; then
            echo "::notice::The account $email manages trainers in the app."
          else
            echo "::warning::No account with the ADMIN_EMAIL e-mail yet: create it in the app, then run this deploy again."
          fi

      - name: Store the function secrets
        run: |
          supabase secrets set --project-ref "$SUPABASE_PROJECT_REF" ANTHROPIC_API_KEY="$ANTHROPIC_API_KEY"
          # New random value each deploy: lets the check below ask Claude as a
          # Premium user. Nobody else knows it.
          smoke=$(openssl rand -hex 24)
          echo "::add-mask::$smoke"
          echo "SMOKE_TEST_TOKEN=$smoke" >> "$GITHUB_ENV"
          supabase secrets set --project-ref "$SUPABASE_PROJECT_REF" SMOKE_TEST_TOKEN="$smoke"
          if [ -n "$REVENUECAT_SECRET_KEY" ]; then
            supabase secrets set --project-ref "$SUPABASE_PROJECT_REF" REVENUECAT_SECRET_KEY="$REVENUECAT_SECRET_KEY"
          fi
          # Where Stripe sends people back (stripe-return.html).
          supabase secrets set --project-ref "$SUPABASE_PROJECT_REF" SITE_URL="$SITE_URL"
          if [ -n "$STRIPE_SECRET_KEY" ]; then
            supabase secrets set --project-ref "$SUPABASE_PROJECT_REF" STRIPE_SECRET_KEY="$STRIPE_SECRET_KEY"
          fi

      - name: Deploy the functions
        run: |
          supabase functions deploy nutrition-coach --project-ref "$SUPABASE_PROJECT_REF"
          supabase functions deploy account --project-ref "$SUPABASE_PROJECT_REF"
          supabase functions deploy trainer-pay --project-ref "$SUPABASE_PROJECT_REF"
          supabase functions deploy stripe-webhook --no-verify-jwt --project-ref "$SUPABASE_PROJECT_REF"

      # Stripe tells the app about hires (paid, renewed, canceled) through a
      # webhook. Created once; its signing secret is only shown at creation,
      # so it is made again if the project lost the secret.
      - name: Connect Stripe's webhook
        if: env.STRIPE_SECRET_KEY != ''
        run: |
          endpoint="https://$SUPABASE_PROJECT_REF.supabase.co/functions/v1/stripe-webhook"
          events=(checkout.session.completed customer.subscription.created customer.subscription.updated customer.subscription.deleted)
          stripe_api() { curl -sS -o /tmp/stripe.json -w "%{http_code}" -H "Authorization: Bearer $STRIPE_SECRET_KEY" "$@"; }
          status=$(stripe_api "https://api.stripe.com/v1/webhook_endpoints?limit=100")
          if [ "$status" = 401 ]; then
            echo "::error::Stripe rejected STRIPE_SECRET_KEY: copy the Secret key again (Stripe → Developers → API keys)."
            exit 1
          elif [ "$status" != 200 ]; then
            echo "::error::Stripe answered HTTP $status: $(jq -r '.error.message // empty' /tmp/stripe.json)"
            exit 1
          fi
          existing=$(jq -r --arg url "$endpoint" '[.data[] | select(.url == $url) | .id] | join(" ")' /tmp/stripe.json)
          has_secret=$(supabase secrets list --project-ref "$SUPABASE_PROJECT_REF" | grep -c STRIPE_WEBHOOK_SECRET || true)
          form=(); for e in "${events[@]}"; do form+=(-d "enabled_events[]=$e"); done
          if [ -n "$existing" ] && [ "$has_secret" -gt 0 ]; then
            id=${existing%% *}
            status=$(stripe_api -X POST "https://api.stripe.com/v1/webhook_endpoints/$id" "${form[@]}" -d disabled=false)
            [ "$status" = 200 ] || { echo "::error::Could not update Stripe's webhook (HTTP $status)."; exit 1; }
            echo "Stripe's webhook is set up."
          else
            for id in $existing; do stripe_api -X DELETE "https://api.stripe.com/v1/webhook_endpoints/$id" > /dev/null; done
            status=$(stripe_api -X POST https://api.stripe.com/v1/webhook_endpoints -d url="$endpoint" -d description="Fitness Life: trainer hires" "${form[@]}")
            if [ "$status" != 200 ]; then
              echo "::error::Could not create Stripe's webhook (HTTP $status): $(jq -r '.error.message // empty' /tmp/stripe.json)"
              exit 1
            fi
            secret=$(jq -r .secret /tmp/stripe.json)
            echo "::add-mask::$secret"
            supabase secrets set --project-ref "$SUPABASE_PROJECT_REF" STRIPE_WEBHOOK_SECRET="$secret"
            echo "Stripe's webhook was created."
          fi
          # An unsigned call must be refused (400): the function has both secrets.
          for attempt in 1 2 3 4 5 6; do
            status=$(curl -sS -o /dev/null -w "%{http_code}" -X POST "$endpoint" -d '{}')
            [ "$status" = 400 ] && break
            sleep 5
          done
          if [ "$status" != 400 ]; then
            echo "::error::The stripe-webhook function is not ready (HTTP $status)."
            exit 1
          fi
          echo "::notice::Trainer hiring with Stripe is on."

      # End-to-end check, like the app does it: anonymous sign-in, the coach's
      # usage status, the paywall for free users, and one short real answer
      # from Claude as Premium.
      - name: Get the app's public settings
        run: .github/scripts/supabase-env.sh

      - name: Check that the AI coach answers
        run: |
          if [ -z "${VITE_SUPABASE_ANON_KEY:-}" ]; then
            echo "::error::Could not read the project's anon key with SUPABASE_ACCESS_TOKEN."
            exit 1
          fi
          url="$VITE_SUPABASE_URL"
          key="$VITE_SUPABASE_ANON_KEY"
          token=$(curl -sS -X POST "$url/auth/v1/signup" -H "apikey: $key" -H "Content-Type: application/json" -d '{"data":{}}' | jq -r '.access_token // empty')
          if [ -z "$token" ]; then
            echo "::error::Anonymous sign-in failed. Check Authentication → Sign In / Providers → Allow anonymous sign-ins."
            exit 1
          fi
          call() {
            curl -sS -o /tmp/answer.json -w "%{http_code}" -X POST "$url/functions/v1/nutrition-coach" \
              -H "Authorization: Bearer $token" -H "apikey: $key" -H "Content-Type: application/json" "${@:2}" -d "$1"
          }
          # A freshly deployed function can take a few seconds to start.
          for attempt in 1 2 3 4 5 6; do
            status=$(call '{"action":"status"}')
            [ "$status" = 200 ] && break
            sleep 5
          done
          if [ "$status" != 200 ]; then
            echo "::error::The nutrition coach did not answer (HTTP $status)."
            cat /tmp/answer.json
            exit 1
          fi
          echo "Usage: $(jq -c .usage /tmp/answer.json)"
          question='{"action":"chat","lang":"es","context":{"goal":"musculo","weightKg":80,"targets":null,"today":{"kcal":0,"protein":0,"carbs":0,"fat":0},"trainedToday":false},"messages":[{"role":"user","text":"Responde solo con un saludo de una frase."}]}'
          status=$(call "$question")
          if [ "$status" != 402 ]; then
            echo "::error::A free user should be offered Premium (HTTP 402), got HTTP $status."
            cat /tmp/answer.json
            exit 1
          fi
          echo "Free users are offered Premium."
          status=$(call "$question" -H "x-smoke-test: $SMOKE_TEST_TOKEN")
          if [ "$status" != 200 ] || [ -z "$(jq -r '.text // empty' /tmp/answer.json)" ]; then
            echo "::error::Claude did not answer (HTTP $status). Check ANTHROPIC_API_KEY and the Anthropic balance."
            cat /tmp/answer.json
            exit 1
          fi
          echo "The coach answered: $(jq -r .text /tmp/answer.json)"
          # The meal plan is the longest answer: it must come back whole and in time.
          plan='{"action":"mealplan","lang":"es","mealsPerDay":4,"text":"","context":{"goal":"musculo","weightKg":80,"targets":{"kcal":2900,"protein":160,"carbs":350,"fat":80},"today":{"kcal":0,"protein":0,"carbs":0,"fat":0},"trainedToday":false}}'
          start=$(date +%s)
          status=$(call "$plan" -H "x-smoke-test: $SMOKE_TEST_TOKEN" --max-time 150)
          echo "Meal plan: HTTP $status in $(( $(date +%s) - start )) s"
          if [ "$status" != 200 ] || [ "$(jq '.days | length' /tmp/answer.json)" != 7 ]; then
            echo "::error::The meal plan failed (HTTP $status)."
            head -c 2000 /tmp/answer.json; echo
            exit 1
          fi
          jq -c '{name, days: (.days | length), day1: [.days[0].meals[] | {slot, time, name, kcal}]}' /tmp/answer.json
