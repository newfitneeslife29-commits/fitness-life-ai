// Google Play Billing para Ridge Rush. Habla con Unity por reflexión (UnitySendMessage),
// así no depende de las clases de Unity al compilar.
apply plugin: 'com.android.library'

android {
    namespace "com.ridgerush.billing"
    compileSdk 34
    defaultConfig {
        minSdk 29
        consumerProguardFiles 'proguard.txt'
    }
    sourceSets {
        main {
            java.srcDirs = ['src']
            manifest.srcFile 'AndroidManifest.xml'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    implementation 'com.android.billingclient:billing:7.1.1'
}
